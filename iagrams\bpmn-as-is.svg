<svg viewBox="0 0 1300 650" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#5b6b74"/>
    </marker>
  </defs>
  <rect width="1300" height="650" fill="#FFFFFF"/>
  <text x="650" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#0F2537">AS-IS Process — Current Manual Emergency Mustering</text>
  <text x="650" y="50" text-anchor="middle" font-size="12" fill="#5b6b74">No digital occupancy record · headcounts typically exceed 30 minutes</text>

  <!-- LANES -->
  <g>
    <rect x="40" y="75" width="150" height="530" fill="#F7FAFB" stroke="#D8E1E5"/>
    <rect x="190" y="75" width="1070" height="530" fill="#FFFFFF" stroke="#D8E1E5"/>
    <rect x="40" y="75" width="1220" height="176" fill="none" stroke="#D8E1E5"/>
    <rect x="40" y="251" width="1220" height="200" fill="none" stroke="#D8E1E5"/>
    <rect x="40" y="451" width="1220" height="154" fill="none" stroke="#D8E1E5"/>
    <text x="65" y="168" font-size="13" font-weight="700" fill="#0F2537" transform="rotate(-90 65 168)" text-anchor="middle">Occupants</text>
    <text x="65" y="356" font-size="13" font-weight="700" fill="#0F2537" transform="rotate(-90 65 356)" text-anchor="middle">Security Warden</text>
    <text x="65" y="533" font-size="13" font-weight="700" fill="#0F2537" transform="rotate(-90 65 533)" text-anchor="middle">Emergency Coordinator</text>
  </g>

  <!-- Start event -->
  <circle cx="240" cy="163" r="20" fill="#2DD4BF"/>
  <text x="240" y="168" text-anchor="middle" font-size="10" fill="#04241F" font-weight="700">Alarm</text>

  <!-- Occupants lane tasks -->
  <rect x="310" y="133" width="200" height="60" rx="10" fill="#0F2537"/>
  <text x="410" y="158" text-anchor="middle" font-size="12" fill="#F2F6F5">Hear alarm / PA</text>
  <text x="410" y="174" text-anchor="middle" font-size="12" fill="#F2F6F5">announcement</text>

  <rect x="560" y="133" width="220" height="60" rx="10" fill="#0F2537"/>
  <text x="670" y="158" text-anchor="middle" font-size="12" fill="#F2F6F5">Evacuate informally —</text>
  <text x="670" y="174" text-anchor="middle" font-size="12" fill="#F2F6F5">no assigned muster point</text>

  <!-- Warden lane tasks -->
  <rect x="310" y="321" width="220" height="60" rx="10" fill="#0F2537"/>
  <text x="420" y="346" text-anchor="middle" font-size="12" fill="#F2F6F5">Call roll manually from</text>
  <text x="420" y="362" text-anchor="middle" font-size="12" fill="#F2F6F5">paper attendance register</text>

  <!-- Gateway -->
  <polygon points="640,321 690,351 640,381 590,351" fill="#FF6B4A"/>
  <text x="640" y="356" text-anchor="middle" font-size="10.5" fill="#2B0E05" font-weight="700">All</text>
  <text x="640" y="368" text-anchor="middle" font-size="10.5" fill="#2B0E05" font-weight="700">present?</text>

  <rect x="740" y="291" width="220" height="60" rx="10" fill="#0F2537"/>
  <text x="850" y="316" text-anchor="middle" font-size="12" fill="#F2F6F5">Search unaccounted areas</text>
  <text x="850" y="332" text-anchor="middle" font-size="12" fill="#F2F6F5">(≈ 30+ minutes, undirected)</text>
  <text x="640" y="300" font-size="11" fill="#5b6b74">No</text>

  <rect x="740" y="401" width="220" height="60" rx="10" fill="#0F2537"/>
  <text x="850" y="426" text-anchor="middle" font-size="12" fill="#F2F6F5">Report verbal headcount</text>
  <text x="850" y="442" text-anchor="middle" font-size="12" fill="#F2F6F5">to coordinator</text>
  <text x="655" y="405" font-size="11" fill="#5b6b74">Yes</text>

  <!-- Coordinator lane tasks -->
  <rect x="1000" y="481" width="200" height="60" rx="10" fill="#0F2537"/>
  <text x="1100" y="506" text-anchor="middle" font-size="12" fill="#F2F6F5">Receive unverifiable</text>
  <text x="1100" y="522" text-anchor="middle" font-size="12" fill="#F2F6F5">verbal headcount</text>

  <!-- End event -->
  <circle cx="1230" cy="511" r="20" fill="#FF6B4A" stroke="#2B0E05" stroke-width="2"/>
  <text x="1230" y="516" text-anchor="middle" font-size="9.5" fill="#2B0E05" font-weight="700">All-clear</text>

  <!-- ARROWS -->
  <path d="M260,163 L308,163" stroke="#5b6b74" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M510,163 L558,163" stroke="#5b6b74" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M670,193 C670,240 500,280 420,319" stroke="#5b6b74" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M530,351 L588,351" stroke="#5b6b74" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M665,328 C700,310 720,305 738,318" stroke="#5b6b74" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M850,291 C850,270 750,280 655,335" stroke="#5b6b74" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <path d="M665,374 C700,395 720,405 738,418" stroke="#5b6b74" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M960,431 C1050,455 1080,465 1090,479" stroke="#5b6b74" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M1200,511 L1210,511" stroke="#5b6b74" stroke-width="1.6" marker-end="url(#arrow)"/>

  <text x="650" y="630" text-anchor="middle" font-size="11" fill="#8FA6B2">COTEMS · CIN815 Postgraduate Diploma in Information Systems · Fiji National University</text>
</svg>
