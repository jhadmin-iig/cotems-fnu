<svg viewBox="0 0 1300 780" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="crow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12" fill="none" stroke="#5b6b74" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect width="1300" height="780" fill="#FFFFFF"/>
  <text x="650" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0F2537">COTEMS — Entity Relationship Diagram</text>
  <text x="650" y="54" text-anchor="middle" font-size="12" fill="#5b6b74">Third normal form · core entities supporting occupancy tracking and emergency mustering</text>

  <!-- ===== USER ===== -->
  <g>
    <rect x="60" y="90" width="240" height="150" rx="10" fill="#0F2537"/>
    <rect x="60" y="90" width="240" height="32" rx="10" fill="#2DD4BF"/>
    <rect x="60" y="112" width="240" height="10" fill="#2DD4BF"/>
    <text x="180" y="111" text-anchor="middle" font-size="14" font-weight="700" fill="#04241F">User</text>
    <g font-size="12.5" fill="#F2F6F5">
      <text x="76" y="140" font-weight="700" text-decoration="underline">user_id (PK)</text>
      <text x="76" y="160">name</text>
      <text x="76" y="180">role — Student / Staff / Visitor</text>
      <text x="76" y="200">phone, email</text>
      <text x="76" y="220">type — internal / visitor</text>
    </g>
  </g>

  <!-- ===== BUILDING ===== -->
  <g>
    <rect x="1000" y="90" width="240" height="150" rx="10" fill="#0F2537"/>
    <rect x="1000" y="90" width="240" height="32" rx="10" fill="#2DD4BF"/>
    <rect x="1000" y="112" width="240" height="10" fill="#2DD4BF"/>
    <text x="1120" y="111" text-anchor="middle" font-size="14" font-weight="700" fill="#04241F">Building</text>
    <g font-size="12.5" fill="#F2F6F5">
      <text x="1016" y="140" font-weight="700" text-decoration="underline">building_id (PK)</text>
      <text x="1016" y="160">name, campus</text>
      <text x="1016" y="180">capacity</text>
      <text x="1016" y="200">muster_point</text>
      <text x="1016" y="220">gps_coordinates</text>
    </g>
  </g>

  <!-- ===== OCCUPANCY LOG ===== -->
  <g>
    <rect x="530" y="330" width="240" height="172" rx="10" fill="#0F2537"/>
    <rect x="530" y="330" width="240" height="32" rx="10" fill="#FF6B4A"/>
    <rect x="530" y="352" width="240" height="10" fill="#FF6B4A"/>
    <text x="650" y="351" text-anchor="middle" font-size="14" font-weight="700" fill="#2B0E05">OccupancyLog</text>
    <g font-size="12.5" fill="#F2F6F5">
      <text x="546" y="380" font-weight="700" text-decoration="underline">log_id (PK)</text>
      <text x="546" y="400">user_id (FK → User)</text>
      <text x="546" y="420">building_id (FK → Building)</text>
      <text x="546" y="440">direction — IN / OUT</text>
      <text x="546" y="460">timestamp</text>
      <text x="546" y="480">method — QR / BLE / Kiosk</text>
    </g>
  </g>

  <!-- ===== EMERGENCY EVENT ===== -->
  <g>
    <rect x="60" y="590" width="250" height="150" rx="10" fill="#0F2537"/>
    <rect x="60" y="590" width="250" height="32" rx="10" fill="#2DD4BF"/>
    <rect x="60" y="612" width="250" height="10" fill="#2DD4BF"/>
    <text x="185" y="611" text-anchor="middle" font-size="14" font-weight="700" fill="#04241F">EmergencyEvent</text>
    <g font-size="12.5" fill="#F2F6F5">
      <text x="76" y="640" font-weight="700" text-decoration="underline">event_id (PK)</text>
      <text x="76" y="660">event_type — Cyclone / Fire / Drill</text>
      <text x="76" y="680">trigger_time</text>
      <text x="76" y="700">coordinator_id (FK → User)</text>
      <text x="76" y="720">status — active / resolved</text>
    </g>
  </g>

  <!-- ===== MUSTER ROLL ===== -->
  <g>
    <rect x="980" y="580" width="270" height="194" rx="10" fill="#0F2537"/>
    <rect x="980" y="580" width="270" height="32" rx="10" fill="#FF6B4A"/>
    <rect x="980" y="602" width="270" height="10" fill="#FF6B4A"/>
    <text x="1115" y="601" text-anchor="middle" font-size="14" font-weight="700" fill="#2B0E05">MusterRoll</text>
    <g font-size="12.5" fill="#F2F6F5">
      <text x="996" y="630" font-weight="700" text-decoration="underline">roll_id (PK)</text>
      <text x="996" y="650">event_id (FK → EmergencyEvent)</text>
      <text x="996" y="670">user_id (FK → User)</text>
      <text x="996" y="690">expected_building_id (FK → Building)</text>
      <text x="996" y="710">actual_check_in_time</text>
      <text x="996" y="730">safety_status — pending / safe</text>
    </g>
  </g>

  <!-- ===== RELATIONSHIPS ===== -->
  <!-- User -> OccupancyLog -->
  <path d="M230,240 C300,290 450,320 545,340" fill="none" stroke="#5b6b74" stroke-width="1.6" marker-end="url(#crow)"/>
  <text x="330" y="285" font-size="11" fill="#5b6b74">1 generates *</text>

  <!-- Building -> OccupancyLog -->
  <path d="M1080,240 C1000,290 850,320 765,340" fill="none" stroke="#5b6b74" stroke-width="1.6" marker-end="url(#crow)"/>
  <text x="900" y="285" font-size="11" fill="#5b6b74">1 recorded at *</text>

  <!-- User -> EmergencyEvent (coordinator) -->
  <path d="M170,240 C160,350 175,470 175,585" fill="none" stroke="#5b6b74" stroke-width="1.6" marker-end="url(#crow)"/>
  <text x="185" y="420" font-size="11" fill="#5b6b74">1 coordinates *</text>

  <!-- User -> MusterRoll -->
  <path d="M300,190 C650,190 1000,300 1080,575" fill="none" stroke="#5b6b74" stroke-width="1.6" marker-end="url(#crow)"/>
  <text x="700" y="200" font-size="11" fill="#5b6b74">1 has entries in *</text>

  <!-- Building -> MusterRoll -->
  <path d="M1060,240 C1090,350 1095,460 1100,575" fill="none" stroke="#5b6b74" stroke-width="1.6" marker-end="url(#crow)"/>
  <text x="1105" y="420" font-size="11" fill="#5b6b74">1 expected at *</text>

  <!-- EmergencyEvent -> MusterRoll -->
  <path d="M310,665 C550,700 800,700 975,665" fill="none" stroke="#5b6b74" stroke-width="1.6" marker-end="url(#crow)"/>
  <text x="600" y="715" font-size="11" fill="#5b6b74">1 produces *</text>

  <text x="650" y="765" text-anchor="middle" font-size="11" fill="#8FA6B2">COTEMS · CIN815 Postgraduate Diploma in Information Systems · Fiji National University</text>
</svg>
