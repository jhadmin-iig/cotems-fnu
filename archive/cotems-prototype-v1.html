<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COTEMS — FNU Campus Occupant Tracking &amp; Emergency Mustering</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#0A1A24;
    --navy-panel:#0F2537;
    --navy-panel-2:#153146;
    --teal:#2DD4BF;
    --coral:#FF6B4A;
    --amber:#FBBF24;
    --red:#EF4444;
    --text-hi:#F2F6F5;
    --text-lo:#8FA6B2;
    --line:rgba(255,255,255,0.08);
    --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(45,212,191,0.10), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(255,107,74,0.08), transparent 55%),
      var(--navy-deep);
    color:var(--text-hi);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }
  /* topographic contour background */
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      repeating-radial-gradient(circle at 85% 20%, transparent 0 38px, rgba(255,255,255,0.02) 39px 40px),
      repeating-radial-gradient(circle at 10% 85%, transparent 0 46px, rgba(255,255,255,0.02) 47px 48px);
    pointer-events:none;
    z-index:0;
  }
  #app{position:relative; z-index:1; max-width:1180px; margin:0 auto; padding:28px 20px 80px;}

  .mono{font-family:'JetBrains Mono', monospace;}
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--teal);
  }
  h1,h2,h3{font-family:'Space Grotesk', sans-serif; font-weight:600; letter-spacing:-0.01em;}

  /* header */
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:26px; gap:14px; flex-wrap:wrap;}
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{
    width:42px; height:42px; border-radius:10px;
    background:linear-gradient(135deg, var(--teal), #1a8f80);
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk'; font-weight:700; font-size:15px; color:#04241f;
    flex-shrink:0;
  }
  .brand-name{font-family:'Space Grotesk'; font-size:16px; font-weight:600;}
  .brand-sub{font-size:12px; color:var(--text-lo);}
  .nav-pills{display:flex; gap:8px; flex-wrap:wrap;}
  .pill{
    font-family:'JetBrains Mono'; font-size:11.5px; letter-spacing:.04em;
    padding:8px 14px; border-radius:999px; border:1px solid var(--line);
    background:rgba(255,255,255,0.02); color:var(--text-lo); cursor:pointer;
    transition:all .15s ease;
  }
  .pill:hover{border-color:rgba(45,212,191,0.4); color:var(--text-hi);}
  .pill.active{background:rgba(45,212,191,0.12); border-color:var(--teal); color:var(--teal);}

  .panel{
    background:var(--navy-panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:24px;
  }
  .grid{display:grid; gap:16px;}
  .g2{grid-template-columns:1fr 1fr;}
  .g3{grid-template-columns:repeat(3,1fr);}
  @media(max-width:760px){.g2,.g3{grid-template-columns:1fr;}}

  /* landing */
  .landing-hero{text-align:center; padding:40px 10px 30px;}
  .landing-hero h1{font-size:clamp(28px,4vw,42px); margin-bottom:10px;}
  .landing-hero p{color:var(--text-lo); max-width:560px; margin:0 auto; font-size:14.5px; line-height:1.6;}
  .role-cards{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:32px;}
  @media(max-width:760px){.role-cards{grid-template-columns:1fr;}}
  .role-card{
    background:var(--navy-panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:26px 22px;
    cursor:pointer;
    transition:transform .18s ease, border-color .18s ease, background .18s ease;
  }
  .role-card:hover{transform:translateY(-3px); border-color:rgba(45,212,191,0.45); background:var(--navy-panel-2);}
  .role-card .ic{font-size:26px; margin-bottom:14px; display:block;}
  .role-card h3{font-size:17px; margin-bottom:6px;}
  .role-card p{color:var(--text-lo); font-size:13px; line-height:1.5;}

  /* buttons */
  .btn{
    font-family:'Inter'; font-weight:600; font-size:13.5px;
    padding:11px 18px; border-radius:9px; border:none; cursor:pointer;
    transition:filter .15s ease, transform .1s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--teal); color:#04241f;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-coral{background:var(--coral); color:#2b0e05;}
  .btn-coral:hover{filter:brightness(1.08);}
  .btn-ghost{background:transparent; color:var(--text-hi); border:1px solid var(--line);}
  .btn-ghost:hover{border-color:rgba(255,255,255,0.25);}
  .btn-danger{background:var(--red); color:#2b0505;}
  .btn-danger:hover{filter:brightness(1.1);}
  .btn:disabled{opacity:.35; cursor:not-allowed;}

  input,select,textarea{
    width:100%; background:rgba(255,255,255,0.03); border:1px solid var(--line);
    color:var(--text-hi); padding:10px 12px; border-radius:8px; font-family:'Inter'; font-size:13.5px;
    outline:none;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--teal);}
  label{font-size:12px; color:var(--text-lo); display:block; margin-bottom:6px; font-family:'JetBrains Mono';}
  .field{margin-bottom:14px;}

  /* back link */
  .back{color:var(--text-lo); font-size:13px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; margin-bottom:18px;}
  .back:hover{color:var(--text-hi);}

  /* status card */
  .status-card{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:18px; border-radius:12px; background:var(--navy-panel-2); border:1px solid var(--line); margin-bottom:20px;
  }
  .status-dot{width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:8px;}
  .dot-in{background:var(--teal); box-shadow:0 0 8px var(--teal);}
  .dot-out{background:var(--text-lo);}

  .building-select{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin:14px 0 20px;}
  @media(max-width:600px){.building-select{grid-template-columns:1fr;}}
  .b-opt{
    padding:12px 14px; border-radius:10px; border:1px solid var(--line); cursor:pointer;
    background:rgba(255,255,255,0.02); font-size:13.5px;
  }
  .b-opt.sel{border-color:var(--teal); background:rgba(45,212,191,0.08);}
  .b-opt .bname{font-weight:600; margin-bottom:2px;}
  .b-opt .bmeta{color:var(--text-lo); font-size:11.5px; font-family:'JetBrains Mono';}

  /* dashboard */
  .dash-top{display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:22px; flex-wrap:wrap;}
  .metric-row{display:flex; gap:14px; flex-wrap:wrap;}
  .metric{background:var(--navy-panel); border:1px solid var(--line); border-radius:12px; padding:14px 18px; min-width:130px;}
  .metric .num{font-family:'Space Grotesk'; font-size:26px; font-weight:700;}
  .metric .lab{font-size:11px; color:var(--text-lo); font-family:'JetBrains Mono'; text-transform:uppercase; letter-spacing:.06em;}

  .tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:24px;}
  @media(max-width:900px){.tiles{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:560px){.tiles{grid-template-columns:1fr;}}
  .tile{background:var(--navy-panel); border:1px solid var(--line); border-radius:12px; padding:16px;}
  .tile-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;}
  .tile-head .bname{font-weight:600; font-size:14px;}
  .tile-head .count{font-family:'JetBrains Mono'; font-size:13px; color:var(--teal);}
  .bar-bg{height:6px; border-radius:4px; background:rgba(255,255,255,0.06); overflow:hidden;}
  .bar-fill{height:100%; background:linear-gradient(90deg, var(--teal), #1a8f80); border-radius:4px; transition:width .4s ease;}
  .tile-meta{font-size:11px; color:var(--text-lo); margin-top:8px; font-family:'JetBrains Mono';}

  .log{max-height:230px; overflow-y:auto; display:flex; flex-direction:column-reverse; gap:8px;}
  .log-row{display:flex; justify-content:space-between; font-size:12.5px; padding:8px 10px; border-radius:8px; background:rgba(255,255,255,0.02);}
  .log-time{color:var(--text-lo); font-family:'JetBrains Mono'; font-size:11px;}

  /* emergency banner */
  .em-banner{
    border-radius:var(--radius); padding:20px 22px; margin-bottom:22px;
    background:linear-gradient(120deg, rgba(239,68,68,0.16), rgba(239,68,68,0.04));
    border:1px solid rgba(239,68,68,0.4);
    display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap;
  }
  .em-banner.calm{background:var(--navy-panel); border:1px solid var(--line);}
  .em-title{font-family:'Space Grotesk'; font-size:17px; font-weight:600; display:flex; align-items:center; gap:10px;}
  .pulse{width:10px; height:10px; border-radius:50%; background:var(--red); animation:pulse 1.4s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.55);}70%{box-shadow:0 0 0 12px rgba(239,68,68,0);}100%{box-shadow:0 0 0 0 rgba(239,68,68,0);}}

  /* tide gauge — signature element */
  .tide-wrap{
    position:relative; height:76px; border-radius:12px; overflow:hidden;
    background:rgba(255,255,255,0.03); border:1px solid var(--line); margin-bottom:22px;
  }
  .tide-label{position:absolute; top:9px; left:14px; font-family:'JetBrains Mono'; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-lo); z-index:3;}
  .tide-pct{position:absolute; top:9px; right:14px; font-family:'Space Grotesk'; font-weight:700; font-size:18px; z-index:3;}
  .tide-fill{position:absolute; left:0; right:0; bottom:0; transition:height .6s cubic-bezier(.4,0,.2,1);}
  .tide-fill svg{position:absolute; top:-14px; left:0; width:200%; height:16px; animation:tideMove 6s linear infinite;}
  @keyframes tideMove{from{transform:translateX(0);}to{transform:translateX(-50%);}}
  .tide-body{position:absolute; left:0; right:0; bottom:0; top:2px;}

  .muster-group{border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; background:var(--navy-panel);}
  .muster-group-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
  .muster-group-head .mtitle{font-weight:600; font-size:14px;}
  .muster-group-head .mprog{font-family:'JetBrains Mono'; font-size:12px; color:var(--text-lo);}
  .person-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:9px 12px; border-radius:8px; margin-bottom:6px; font-size:13px;
    background:rgba(255,255,255,0.02);
  }
  .person-row.safe{background:rgba(45,212,191,0.06);}
  .person-row.pending{background:rgba(251,191,36,0.06);}
  .person-name{display:flex; flex-direction:column;}
  .person-name .pid{font-family:'JetBrains Mono'; font-size:10.5px; color:var(--text-lo);}
  .tag{font-family:'JetBrains Mono'; font-size:10.5px; padding:3px 9px; border-radius:999px; letter-spacing:.03em;}
  .tag-safe{background:rgba(45,212,191,0.15); color:var(--teal);}
  .tag-pending{background:rgba(251,191,36,0.15); color:var(--amber);}
  .tag-visitor{background:rgba(255,107,74,0.15); color:var(--coral); margin-right:6px;}

  .summary-box{background:var(--navy-panel-2); border:1px solid var(--line); border-radius:12px; padding:20px; text-align:center;}
  .summary-box .big{font-family:'Space Grotesk'; font-size:32px; font-weight:700; color:var(--teal);}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--navy-panel-2); border:1px solid var(--teal); color:var(--text-hi);
    padding:12px 20px; border-radius:10px; font-size:13px; z-index:50;
    box-shadow:0 8px 30px rgba(0,0,0,0.4);
  }
  .footer-note{text-align:center; color:var(--text-lo); font-size:11.5px; margin-top:36px; font-family:'JetBrains Mono';}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------------- STATE ---------------- */
const BUILDINGS = [
  {id:'lib', name:'Library & Learning Commons', capacity:220, muster:'Point A — Main Oval'},
  {id:'ict', name:'ICT & Engineering Block',    capacity:180, muster:'Point B — Rear Car Park'},
  {id:'sci', name:'Science Complex',            capacity:150, muster:'Point A — Main Oval'},
  {id:'adm', name:'Administration Building',    capacity:90,  muster:'Point C — Front Lawn'},
  {id:'hub', name:'Student Hub & Cafeteria',    capacity:200, muster:'Point B — Rear Car Park'},
  {id:'trd', name:'Trades & Workshops',         capacity:130, muster:'Point D — Workshop Yard'},
];

const FIRST = ['Jotame','Suka','Viliame','Sushil','Litia','Ana','Josaia','Mereseini','Ravi','Priya','Semi','Vasiti','Tomasi','Alanieta','Rohit','Salote','Peni','Kelera'];
const LAST  = ['Halofaki','Buadromo','Kolinisau','Pipaliya','Naco','Waqa','Devi','Tuilagi','Sharma','Rokotuiveikau','Chand','Vosanibola'];

function seedUsers(){
  const users = [];
  let n=1;
  FIRST.forEach((f,i)=>{
    const role = i % 4 === 0 ? 'Staff' : 'Student';
    const id = role==='Staff' ? `FNU-SF-${String(1000+n)}` : `FNU-ST-${String(2000+n)}`;
    users.push({id, name:`${f} ${LAST[i % LAST.length]}`, role, type:'internal', phone:`+679 ${900+n}${1000+n}`});
    n++;
  });
  return users;
}

const state = {
  view:'landing',        // landing | checkin | visitor | dashboard
  users: seedUsers(),
  visitors: [],
  occupancy: {},          // userId -> buildingId or null
  log: [],                // {id,name,building,dir,time,method}
  currentUserId: null,
  selectedBuilding: null,
  emergency: null,        // {type, startedAt, roll: {userId: {status,time}}}
  emergencyHistory: [],
  toast: null,
};

// seed a plausible mid-day occupancy state
(function seedOccupancy(){
  const dist = ['lib','lib','ict','sci','hub','hub','adm','trd','lib','sci','hub','ict'];
  state.users.forEach((u,i)=>{
    if(i < dist.length){
      state.occupancy[u.id] = dist[i];
      state.log.push({id:cryptoId(), name:u.name, building:dist[i], dir:'IN', time: nowMinus(20+i*3), method:'QR'});
    } else {
      state.occupancy[u.id] = null;
    }
  });
})();

function cryptoId(){ return Math.random().toString(36).slice(2,9); }
function nowMinus(mins){ const d = new Date(Date.now()-mins*60000); return fmtTime(d); }
function fmtTime(d){ return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'}); }
function buildingName(id){ const b = BUILDINGS.find(x=>x.id===id); return b? b.name : '—'; }
function findUser(id){ return state.users.find(u=>u.id===id) || state.visitors.find(v=>v.id===id); }

function showToast(msg){
  state.toast = msg;
  render();
  setTimeout(()=>{ state.toast=null; render(); }, 2600);
}

/* ---------------- ACTIONS ---------------- */
function goto(view){ state.view = view; state.selectedBuilding=null; render(); }

function selectUser(id){ state.currentUserId = id; state.selectedBuilding=null; render(); }

function pickBuilding(id){ state.selectedBuilding = id; render(); }

function doCheckIn(){
  const u = findUser(state.currentUserId);
  if(!u || !state.selectedBuilding) return;
  state.occupancy[u.id] = state.selectedBuilding;
  state.log.push({id:cryptoId(), name:u.name, building:state.selectedBuilding, dir:'IN', time:fmtTime(new Date()), method:'QR'});
  showToast(`Checked in to ${buildingName(state.selectedBuilding)}`);
}

function doCheckOut(){
  const u = findUser(state.currentUserId);
  if(!u) return;
  const b = state.occupancy[u.id];
  state.occupancy[u.id] = null;
  state.log.push({id:cryptoId(), name:u.name, building:b, dir:'OUT', time:fmtTime(new Date()), method:'QR'});
  showToast(`Checked out of ${buildingName(b)}`);
}

function registerVisitor(data){
  const id = `FNU-VIS-${1000+state.visitors.length+1}`;
  const visitor = {id, name:data.name, role:'Visitor', type:'visitor', phone:data.phone, host:data.host, purpose:data.purpose};
  state.visitors.push(visitor);
  state.occupancy[id] = data.building;
  state.log.push({id:cryptoId(), name:visitor.name, building:data.building, dir:'IN', time:fmtTime(new Date()), method:'Kiosk'});
  state.currentUserId = id;
  showToast(`Visitor pass issued: ${id}`);
  state.view='visitor-pass';
  render();
}

function visitorCheckOut(id){
  const b = state.occupancy[id];
  const v = findUser(id);
  state.occupancy[id]=null;
  state.log.push({id:cryptoId(), name:v.name, building:b, dir:'OUT', time:fmtTime(new Date()), method:'Kiosk'});
  showToast('Visitor checked out — thank you for visiting FNU');
  goto('landing');
}

function occupantsOf(buildingId){
  const all = [...state.users, ...state.visitors];
  return all.filter(u => state.occupancy[u.id] === buildingId);
}

function totalOnCampus(){
  return Object.values(state.occupancy).filter(Boolean).length;
}

function declareEmergency(type){
  const roll = {};
  const all = [...state.users, ...state.visitors];
  all.forEach(u=>{
    const b = state.occupancy[u.id];
    if(b){ roll[u.id] = {status:'pending', building:b, time:null}; }
  });
  state.emergency = {type, startedAt:new Date(), roll};
  showToast(`Emergency declared: ${type}. Muster roll generated.`);
  render();
}

function musterCheckIn(userId){
  if(!state.emergency) return;
  state.emergency.roll[userId].status = 'safe';
  state.emergency.roll[userId].time = fmtTime(new Date());
  render();
}

function resolveEmergency(){
  const roll = state.emergency.roll;
  const total = Object.keys(roll).length;
  const safe = Object.values(roll).filter(r=>r.status==='safe').length;
  state.emergencyHistory.push({
    type: state.emergency.type,
    startedAt: state.emergency.startedAt,
    endedAt: new Date(),
    total, safe,
  });
  state.emergency = null;
  render();
}

/* ---------------- RENDER HELPERS ---------------- */
function el(html){ const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }

function renderTopbar(activeView){
  return `
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">CO</div>
      <div>
        <div class="brand-name">COTEMS</div>
        <div class="brand-sub">FNU Nasinu Campus · Occupant Tracking &amp; Emergency Mustering</div>
      </div>
    </div>
    <div class="nav-pills">
      <div class="pill ${activeView==='landing'?'active':''}" onclick="goto('landing')">Home</div>
      <div class="pill ${activeView==='dashboard'?'active':''}" onclick="goto('dashboard')">Warden Dashboard</div>
    </div>
  </div>`;
}

function renderLanding(){
  return `
  ${renderTopbar('landing')}
  <div class="landing-hero">
    <div class="eyebrow">Pilot — Nasinu Campus</div>
    <h1 style="margin-top:10px;">Know who's on campus. Muster them fast.</h1>
    <p>Tap a checkpoint to check in or out, register as a visitor at the gate, or open the warden dashboard to see live occupancy and run a mustering drill.</p>
  </div>
  <div class="role-cards">
    <div class="role-card" onclick="goto('checkin')">
      <span class="ic">🪪</span>
      <h3>Student / Staff check-in</h3>
      <p>Scan a building checkpoint to log your entry or exit. Simulates tapping a posted QR code.</p>
    </div>
    <div class="role-card" onclick="goto('visitor')">
      <span class="ic">🧾</span>
      <h3>Visitor self-registration</h3>
      <p>Register at the gate kiosk with your host and purpose of visit, and receive a visitor pass.</p>
    </div>
    <div class="role-card" onclick="goto('dashboard')">
      <span class="ic">📡</span>
      <h3>Security &amp; warden dashboard</h3>
      <p>View live building occupancy, declare an emergency, and track the muster roll in real time.</p>
    </div>
  </div>
  <div class="footer-note">COTEMS prototype · CIN815 Postgraduate Diploma in Information Systems · Fiji National University</div>
  `;
}

function renderCheckin(){
  const u = state.currentUserId ? findUser(state.currentUserId) : null;
  const currentBuilding = u ? state.occupancy[u.id] : null;

  const userOptions = state.users.map(x=>`<option value="${x.id}" ${state.currentUserId===x.id?'selected':''}>${x.name} — ${x.id}</option>`).join('');

  let body = `
    <div class="panel">
      <div class="field">
        <label>Select your profile (simulated ID tap)</label>
        <select onchange="selectUser(this.value)">
          <option value="">— Choose your name —</option>
          ${userOptions}
        </select>
      </div>
  `;

  if(u){
    body += `
      <div class="status-card">
        <div>
          <div style="font-weight:600;">${u.name} <span class="mono" style="color:var(--text-lo); font-size:12px;">· ${u.id}</span></div>
          <div style="font-size:12.5px; color:var(--text-lo); margin-top:4px;">
            <span class="status-dot ${currentBuilding?'dot-in':'dot-out'}"></span>
            ${currentBuilding ? `Currently in ${buildingName(currentBuilding)}` : 'Currently off campus'}
          </div>
        </div>
        ${currentBuilding ? `<button class="btn btn-danger" onclick="doCheckOut(); render();">Check out</button>` : ''}
      </div>
    `;

    if(!currentBuilding){
      body += `<label style="margin-bottom:8px;">Tap a checkpoint to check in</label>
        <div class="building-select">
        ${BUILDINGS.map(b=>`
          <div class="b-opt ${state.selectedBuilding===b.id?'sel':''}" onclick="pickBuilding('${b.id}')">
            <div class="bname">${b.name}</div>
            <div class="bmeta">Muster: ${b.muster}</div>
          </div>`).join('')}
        </div>
        <button class="btn btn-primary" ${!state.selectedBuilding?'disabled':''} onclick="doCheckIn(); render();">Confirm check-in</button>
      `;
    }
  }

  body += `</div>`;

  return `
  ${renderTopbar('checkin')}
  <div class="back" onclick="goto('landing')">← Back</div>
  <h2 style="margin-bottom:16px;">Checkpoint check-in / check-out</h2>
  ${body}
  `;
}

function renderVisitorForm(){
  return `
  ${renderTopbar('visitor')}
  <div class="back" onclick="goto('landing')">← Back</div>
  <h2 style="margin-bottom:16px;">Visitor self-registration — Nasinu Gate Kiosk</h2>
  <div class="panel">
    <div class="grid g2">
      <div class="field"><label>Full name</label><input id="v-name" placeholder="e.g. Mesake Rabuka"></div>
      <div class="field"><label>Contact phone</label><input id="v-phone" placeholder="+679 ..."></div>
      <div class="field"><label>Host (staff/department)</label><input id="v-host" placeholder="e.g. Dr. Naco, CST"></div>
      <div class="field">
        <label>Building you're visiting</label>
        <select id="v-building">
          ${BUILDINGS.map(b=>`<option value="${b.id}">${b.name}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="field"><label>Purpose of visit</label><textarea id="v-purpose" rows="2" placeholder="e.g. Contractor — AC servicing"></textarea></div>
    <button class="btn btn-coral" onclick="submitVisitor()">Register &amp; check in</button>
  </div>
  `;
}

function submitVisitor(){
  const name = document.getElementById('v-name').value.trim();
  const phone = document.getElementById('v-phone').value.trim();
  const host = document.getElementById('v-host').value.trim();
  const building = document.getElementById('v-building').value;
  const purpose = document.getElementById('v-purpose').value.trim();
  if(!name || !phone){ showToast('Please enter at least your name and phone number'); return; }
  registerVisitor({name, phone, host, building, purpose});
}

function renderVisitorPass(){
  const v = findUser(state.currentUserId);
  return `
  ${renderTopbar('visitor')}
  <div class="panel" style="max-width:440px; margin:40px auto; text-align:center;">
    <div class="eyebrow">Visitor pass issued</div>
    <h2 style="margin:14px 0 4px;">${v.name}</h2>
    <div class="mono" style="color:var(--text-lo); margin-bottom:18px;">${v.id}</div>
    <div style="text-align:left; font-size:13.5px; line-height:2;">
      <div><strong>Checked into:</strong> ${buildingName(state.occupancy[v.id])}</div>
      <div><strong>Host:</strong> ${v.host || '—'}</div>
      <div><strong>Purpose:</strong> ${v.purpose || '—'}</div>
    </div>
    <p style="color:var(--text-lo); font-size:12.5px; margin:18px 0;">Keep this pass active while on campus. Please check out at reception before you leave.</p>
    <button class="btn btn-ghost" onclick="visitorCheckOut('${v.id}')">Check out now</button>
  </div>
  `;
}

function renderTideGauge(pct){
  return `
  <div class="tide-wrap">
    <div class="tide-label">Muster progress</div>
    <div class="tide-pct">${pct}%</div>
    <div class="tide-fill" style="height:${pct}%; background:linear-gradient(180deg, rgba(45,212,191,0.55), rgba(45,212,191,0.85));">
      <svg viewBox="0 0 200 20" preserveAspectRatio="none">
        <path d="M0,10 Q25,0 50,10 T100,10 T150,10 T200,10 V20 H0 Z" fill="rgba(45,212,191,0.9)"></path>
      </svg>
    </div>
  </div>`;
}

function renderDashboard(){
  const total = totalOnCampus();
  const tiles = BUILDINGS.map(b=>{
    const occ = occupantsOf(b.id);
    const pct = Math.min(100, Math.round((occ.length / b.capacity) * 100));
    return `
    <div class="tile">
      <div class="tile-head"><div class="bname">${b.name}</div><div class="count">${occ.length}/${b.capacity}</div></div>
      <div class="bar-bg"><div class="bar-fill" style="width:${pct}%;"></div></div>
      <div class="tile-meta">Muster: ${b.muster}</div>
    </div>`;
  }).join('');

  const recentLog = [...state.log].slice(-25).map(l=>`
    <div class="log-row">
      <span>${l.name} — <span style="color:${l.dir==='IN'?'var(--teal)':'var(--text-lo)'}">${l.dir}</span> ${buildingName(l.building)}</span>
      <span class="log-time">${l.time} · ${l.method}</span>
    </div>`).join('') || `<div class="log-row"><span>No activity yet</span></div>`;

  let emergencySection = '';

  if(state.emergency){
    const roll = state.emergency.roll;
    const ids = Object.keys(roll);
    const safeCount = ids.filter(id=>roll[id].status==='safe').length;
    const pct = ids.length ? Math.round((safeCount/ids.length)*100) : 100;

    const byMuster = {};
    ids.forEach(id=>{
      const b = BUILDINGS.find(x=>x.id===roll[id].building);
      const key = b ? b.muster : 'Unassigned';
      byMuster[key] = byMuster[key] || [];
      byMuster[key].push(id);
    });

    const groups = Object.entries(byMuster).map(([muster, memberIds])=>{
      const safeN = memberIds.filter(id=>roll[id].status==='safe').length;
      const rows = memberIds.map(id=>{
        const u = findUser(id);
        const r = roll[id];
        const isVisitor = u.type==='visitor';
        return `
        <div class="person-row ${r.status}">
          <div class="person-name">
            <span>${isVisitor?'<span class=\"tag tag-visitor\">VISITOR</span>':''}${u.name}</span>
            <span class="pid">${u.id}${u.phone? ' · '+u.phone:''}</span>
          </div>
          ${r.status==='safe'
            ? `<span class="tag tag-safe">SAFE · ${r.time}</span>`
            : `<button class="btn btn-ghost" style="padding:6px 12px; font-size:12px;" onclick="musterCheckIn('${id}')">Mark safe at muster</button>`}
        </div>`;
      }).join('');
      return `
      <div class="muster-group">
        <div class="muster-group-head">
          <div class="mtitle">${muster}</div>
          <div class="mprog">${safeN}/${memberIds.length} accounted</div>
        </div>
        ${rows}
      </div>`;
    }).join('');

    emergencySection = `
      <div class="em-banner">
        <div>
          <div class="em-title"><span class="pulse"></span> Active emergency — ${state.emergency.type}</div>
          <div style="font-size:12.5px; color:var(--text-lo); margin-top:4px;">Declared at ${fmtTime(state.emergency.startedAt)} · ${ids.length} occupants expected at muster points</div>
        </div>
        <button class="btn btn-ghost" onclick="resolveEmergency()">Resolve &amp; stand down</button>
      </div>
      ${renderTideGauge(pct)}
      <h3 style="margin-bottom:12px;">Muster roll by assembly point</h3>
      ${groups}
    `;
  } else {
    emergencySection = `
      <div class="em-banner calm">
        <div>
          <div class="em-title" style="color:var(--text-hi);">All clear</div>
          <div style="font-size:12.5px; color:var(--text-lo); margin-top:4px;">No active emergency event. Declare one to generate a live muster roll.</div>
        </div>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <button class="btn btn-danger" onclick="declareEmergency('Cyclone Alert')">Declare: Cyclone</button>
          <button class="btn btn-coral" onclick="declareEmergency('Fire Alarm')">Declare: Fire</button>
          <button class="btn btn-ghost" onclick="declareEmergency('Evacuation Drill')">Run: Drill</button>
        </div>
      </div>
    `;
  }

  const history = state.emergencyHistory.slice().reverse().map(h=>`
    <div class="log-row">
      <span>${h.type} — ${h.safe}/${h.total} accounted</span>
      <span class="log-time">${fmtTime(h.startedAt)} → ${fmtTime(h.endedAt)}</span>
    </div>`).join('');

  return `
  ${renderTopbar('dashboard')}
  <div class="back" onclick="goto('landing')">← Back</div>
  <div class="dash-top">
    <h2>Warden dashboard</h2>
    <div class="metric-row">
      <div class="metric"><div class="num">${total}</div><div class="lab">On campus now</div></div>
      <div class="metric"><div class="num">${state.visitors.filter(v=>state.occupancy[v.id]).length}</div><div class="lab">Active visitors</div></div>
      <div class="metric"><div class="num">${BUILDINGS.length}</div><div class="lab">Buildings tracked</div></div>
    </div>
  </div>

  ${emergencySection}

  <h3 style="margin-bottom:12px;">Live building occupancy</h3>
  <div class="tiles">${tiles}</div>

  <div class="grid g2">
    <div class="panel">
      <h3 style="margin-bottom:12px; font-size:14px;">Recent checkpoint activity</h3>
      <div class="log">${recentLog}</div>
    </div>
    <div class="panel">
      <h3 style="margin-bottom:12px; font-size:14px;">Past emergency events</h3>
      <div class="log">${history || '<div class="log-row"><span>No past events recorded this session</span></div>'}</div>
    </div>
  </div>
  `;
}

function render(){
  const app = document.getElementById('app');
  let html = '';
  if(state.view==='landing') html = renderLanding();
  else if(state.view==='checkin') html = renderCheckin();
  else if(state.view==='visitor') html = renderVisitorForm();
  else if(state.view==='visitor-pass') html = renderVisitorPass();
  else if(state.view==='dashboard') html = renderDashboard();

  if(state.toast) html += `<div class="toast">${state.toast}</div>`;

  app.innerHTML = html;
}

render();
</script>
</body>
</html>
